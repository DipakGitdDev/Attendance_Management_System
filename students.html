<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Students</title>

<link rel="stylesheet" href="/css/students.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<!-- Sidebar -->

<aside class="sidebar">

<div class="logo">

<h2>AttendanceMS</h2>

</div>

<ul>

<li onclick="dashboardPage()">

<i class="fa-solid fa-house"></i>

Dashboard

</li>

<li class="active">

<i class="fa-solid fa-users"></i>

Students

</li>

<li onclick="teacherPage()">

<i class="fa-solid fa-user-tie"></i>

Teachers

</li>

<li onclick="attendancePage()">

<i class="fa-solid fa-calendar-check"></i>

Attendance

</li>

<li onclick="reportPage()">

<i class="fa-solid fa-chart-column"></i>

Reports

</li>

<li onclick="settingPage()">

<i class="fa-solid fa-gear"></i>

Settings

</li>

<li onclick="logoutPage()">

<i class="fa-solid fa-right-from-bracket"></i>

Logout

</li>

</ul>

</aside>

<!-- Main -->

<div class="main-content">

<h1>Student Management</h1>

<div class="top-actions">

<input
type="text"
id="searchStudent"
placeholder="Search Student..."
onkeyup="searchStudent()">

<button onclick="openForm()">

<i class="fa-solid fa-plus"></i>

Add Student

</button>

</div>

<table>

    <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Email</th>

            <th>Course</th>

            <th>Action</th>

        </tr>

    </thead>

    <tbody id="studentTable">

        <tr>

            <td>1</td>

            <td>Rahul Sharma</td>

            <td>rahul@gmail.com</td>

            <td>BCA</td>

            <td>

                <button class="edit-btn" onclick="editStudent(this)">
                    Edit
                </button>

                <button class="delete-btn" onclick="deleteStudent(this)">
                    Delete
                </button>

            </td>

        </tr>

        <tr>

            <td>2</td>

            <td>Priya Patel</td>

            <td>priya@gmail.com</td>

            <td>BSc</td>

            <td>

                <button class="edit-btn" onclick="editStudent(this)">
                    Edit
                </button>

                <button class="delete-btn" onclick="deleteStudent(this)">
                    Delete
                </button>

            </td>

        </tr>

    </tbody>

</table>

<div class="pagination">

    <div class="page-info">

        Showing 1 - 10 of 50 Students

    </div>

    <div class="page-buttons">

        <button id="prevBtn">

            Previous

        </button>

        <button class="active-page">

            1

        </button>

        <button>

            2

        </button>

        <button>

            3

        </button>


        <button id="nextBtn">

            Next

        </button>

    </div>

</div>

<!-- Add Student Popup -->

<div class="popup" id="studentPopup">

    <div class="popup-content">

    <h2>Add Student</h2>

    <input type="text" id="studentName" placeholder="Student Name">

    <input type="email" id="studentEmail" placeholder="Email Address">

    <input type="text" id="studentCourse" placeholder="Course">

    <input type="text" id="studentRoll" placeholder="Roll Number">

    <input type="text" id="studentPhone" placeholder="Phone Number">

       <div class="popup-buttons">

    <button
class="save-btn"
id="saveButton"
onclick="saveStudent()">

Save

</button>

    <button class="cancel-btn" onclick="closeForm()">

        Cancel

    </button>

</div>

    </div>

</div>

</div>

</div>

<script src="/js/script.js"></script>

</body>

</html>

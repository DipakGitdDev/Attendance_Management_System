<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AttendanceMS Login</title>

<link rel="stylesheet" href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<div class="container">

<div class="left">

<h1>AttendanceMS</h1>

<h2>Welcome Back!</h2>

<p>

Manage attendance, students and reports
from one secure dashboard.

</p>

<img src="images/login-illustration.png">

</div>

<div class="right">

<form>

<h2>Login</h2>

<div class="input-box">

<i class="fa fa-user"></i>

<input type="text"
placeholder="Username"
required>

</div>

<div class="input-box">

<i class="fa fa-lock"></i>

<input type="password"
placeholder="Password"
required>

</div>

<button>

Login

</button>

<p>

Forgot Password?

<a href="#">

Click Here

</a>

</p>

</form>

</div>

</div>

</body>

</html>
